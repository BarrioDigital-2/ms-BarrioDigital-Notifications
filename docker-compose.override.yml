# ========== SOLO DESARROLLO LOCAL ==========
# Docker Compose carga este archivo automaticamente junto a docker-compose.yml
# cuando se ejecuta "docker compose up -d" SIN la opcion -f.
#
# En la EC2 de mensajeria se usa "-f docker-compose.yml -f docker-compose.prod.yml",
# asi que este archivo se ignora y MySQL no se levanta en produccion
# (en produccion MySQL vive en la EC2 de datos, ver ms-barriodigital-requests).
#
# Resultado en local: cluster RabbitMQ + Kafka + MySQL con un solo comando.

services:
  # ========== BASE DE DATOS (ms-requests) ==========
  mysql:
    image: mysql:8.4
    container_name: barriodigital-mysql
    environment:
      # Valores por defecto alineados con el .env de barrioDigitalApp (usuario root)
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-barriodigital}
    ports:
      # 3307 en el host porque el 3306 lo usa el MySQL instalado en Windows
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - barriodigital-net

volumes:
  mysql_data:
