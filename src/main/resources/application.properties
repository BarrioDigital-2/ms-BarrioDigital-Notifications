spring.application.name=ms-barriodigital-notifications
server.port=8082

# ========== CONEXION A RABBITMQ ==========
# En local apunta a rabbit1 del docker-compose (usuario barriodigital, no guest)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ========== LISTENERS ==========
# Modo manual: el consumidor decide cuando hacer ACK o NACK
spring.rabbitmq.listener.simple.acknowledge-mode=manual
# Prefetch: procesa 1 mensaje a la vez (Fair Dispatch)
spring.rabbitmq.listener.simple.prefetch=1

# ========== REINTENTOS CON EXPONENTIAL BACKOFF ==========
# Aplican cuando el listener lanza una excepcion (ej. JSON invalido que no se puede convertir al DTO):
# 3 intentos (1 s, 2 s, 4 s) y luego NACK -> DLQ (ver RabbitMQConfig.rechazarADlqRecoverer).
# Los errores que el consumer atrapa los resuelve el mismo con basicNack -> DLQ, sin reintentos.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-retries=3
